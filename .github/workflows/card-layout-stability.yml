name: Card layout stability

# Guards the card style token contract documented in
# docs/card-style-tokens.md. Any drift between BYLINE_LAYOUT_CLASS /
# CARD_TITLE_CLASS / CARD_DESCRIPTION_CLASS and the matching skeletons
# fails the build before it can ship a layout shift to users.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  layout-stability:
    name: vitest — cardLayoutStability
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Cache Bun's global install store keyed on bun.lockb so installs reuse
      # downloaded tarballs across runs. The frozen lockfile below still
      # enforces deterministic resolution — caching only avoids re-downloading
      # already-resolved versions.
      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck (catches missing/renamed tokens)
        run: bunx tsc --noEmit

      - name: Verify card style token snapshot is in sync
        run: node scripts/update-card-style-snapshots.mjs

      - name: Run card layout stability tests
        id: vitest
        run: |
          bunx vitest run src/components/__tests__/cardLayoutStability.test.tsx \
            --reporter=verbose \
            --reporter=json --outputFile=vitest-report.json

      - name: Write PR check summary (token/class mismatches)
        if: always()
        run: node scripts/card-layout-summary.mjs vitest-report.json

      - name: Upload vitest report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: card-layout-vitest-report
          path: vitest-report.json
          if-no-files-found: ignore