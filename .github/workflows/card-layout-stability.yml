name: Card layout stability

# Guards the card style token contract documented in
# docs/card-style-tokens.md. Any drift between BYLINE_LAYOUT_CLASS /
# CARD_TITLE_CLASS / CARD_DESCRIPTION_CLASS and the matching skeletons
# fails the build before it can ship a layout shift to users.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  layout-stability:
    name: vitest — cardLayoutStability
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck (catches missing/renamed tokens)
        run: bunx tsc --noEmit

      - name: Run card layout stability tests
        run: bunx vitest run src/components/__tests__/cardLayoutStability.test.tsx --reporter=verbose