name: Visual regression

# Runs the Playwright screenshot suite (e2e/visual-regression.spec.ts plus the
# byline / card-height stability specs) on every PR and push to main. On
# failure, the playwright-report (with diff PNGs) and test-results folder are
# uploaded as artifacts so reviewers can inspect actual vs expected without
# re-running anything locally.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  playwright:
    name: Playwright — visual regression
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # This project is Vite + React (no Next.js / no .next directory). The
      # equivalent of Next's build cache is Vite's dep-optimizer cache at
      # `node_modules/.vite`, which stores prebundled deps so the dev server
      # the Playwright webServer boots doesn't have to re-optimize the
      # whole dep graph on every CI run. Cache hit shaves ~15-30s off
      # `bun run dev` startup.
      #
      # Key includes the lockfile hash so the cache is invalidated whenever
      # dependencies change (matching the frozen-lockfile install above),
      # plus the vite config hash so config edits also bust it.
      - name: Cache Vite dep-optimizer
        uses: actions/cache@v4
        with:
          path: |
            node_modules/.vite
            node_modules/.cache
          key: ${{ runner.os }}-vite-${{ hashFiles('**/bun.lockb', 'vite.config.*') }}
          restore-keys: |
            ${{ runner.os }}-vite-

      # Resolve the installed @playwright/test version so the browser cache
      # key is tied to *the binaries Playwright actually wants*, not to
      # bun.lockb (which churns on every unrelated dep bump and would
      # needlessly invalidate the 150 MB browser download).
      - name: Resolve Playwright version
        id: pw-version
        run: |
          version=$(node -p "require('@playwright/test/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Playwright version: $version"

      # Cache the Playwright browser binaries (~150 MB). We cache the global
      # ms-playwright directory keyed on OS + Playwright version + which
      # browser channels we install. A cache hit skips the full browser
      # download and only re-runs the apt-get system-deps step (fast).
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.pw-version.outputs.version }}-chromium
          restore-keys: |
            ${{ runner.os }}-playwright-${{ steps.pw-version.outputs.version }}-
            ${{ runner.os }}-playwright-

      - name: Install Playwright chromium + OS deps (cache miss)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps chromium

      # On cache hit the browser binaries are already on disk; we only need
      # the system libraries (libnss3, libatk, fonts, etc.) which are not
      # part of ~/.cache/ms-playwright.
      - name: Install Playwright OS deps only (cache hit)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: bunx playwright install-deps chromium

      - name: Run Playwright tests
        run: bunx playwright test --reporter=list,html
        env:
          # Force a stable CI baseline so screenshot diffs aren't tainted by
          # the local dev fonts the contributor happened to have installed.
          CI: "1"

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload screenshot diffs (failures only)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Summary
        if: failure()
        run: |
          {
            echo "## Visual regression — ❌ failure"
            echo ""
            echo "Download the **playwright-report** artifact above and open"
            echo "\`index.html\` to view the actual vs expected vs diff PNG for"
            echo "each failing test. The raw diff images live in the"
            echo "**playwright-test-results** artifact."
            echo ""
            echo "To accept an intentional visual change locally:"
            echo ""
            echo '```bash'
            echo "bunx playwright test --update-snapshots"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"