name: Visual regression

# Runs the Playwright screenshot suite (e2e/visual-regression.spec.ts plus the
# byline / card-height stability specs) on every PR and push to main. On
# failure, the playwright-report (with diff PNGs) and test-results folder are
# uploaded as artifacts so reviewers can inspect actual vs expected without
# re-running anything locally.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  playwright:
    name: Playwright — visual regression
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Use the split restore + save pattern so the cache is *saved even if
      # Playwright (or any later step) fails*. The combined `actions/cache@v4`
      # only writes on a fully successful job, which means a single flaky
      # visual-diff failure would force every subsequent PR to re-download
      # all Bun deps from scratch. Splitting the action keeps the populated
      # cache available for the next run regardless of test outcome, while
      # still respecting the frozen lockfile for reproducible installs.
      - name: Restore Bun cache
        id: bun-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Save the cache immediately after a successful install, even if later
      # steps fail. `if: always()` runs on failure too; the inner guard skips
      # the save on an exact-key cache hit (nothing new to persist).
      - name: Save Bun cache
        if: always() && steps.bun-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lockb') }}

      # This project is Vite + React (no Next.js / no .next directory). The
      # equivalent of Next's build cache is Vite's dep-optimizer cache at
      # `node_modules/.vite`, which stores prebundled deps so the dev server
      # the Playwright webServer boots doesn't have to re-optimize the
      # whole dep graph on every CI run. Cache hit shaves ~15-30s off
      # `bun run dev` startup.
      #
      # Key includes the lockfile hash so the cache is invalidated whenever
      # dependencies change (matching the frozen-lockfile install above),
      # plus the vite config hash so config edits also bust it.
      - name: Cache Vite dep-optimizer
        uses: actions/cache@v4
        with:
          path: |
            node_modules/.vite
            node_modules/.cache
          key: ${{ runner.os }}-vite-${{ hashFiles('**/bun.lockb', 'vite.config.*') }}
          restore-keys: |
            ${{ runner.os }}-vite-

      # Resolve the installed @playwright/test version so the browser cache
      # key is tied to *the binaries Playwright actually wants*, not to
      # bun.lockb (which churns on every unrelated dep bump and would
      # needlessly invalidate the 150 MB browser download).
      - name: Resolve Playwright version
        id: pw-version
        run: |
          version=$(node -p "require('@playwright/test/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Playwright version: $version"

      # Cache the Playwright browser binaries (~150 MB). We cache the global
      # ms-playwright directory keyed on OS + Playwright version + which
      # browser channels we install. A cache hit skips the full browser
      # download and only re-runs the apt-get system-deps step (fast).
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.pw-version.outputs.version }}-chromium
          restore-keys: |
            ${{ runner.os }}-playwright-${{ steps.pw-version.outputs.version }}-
            ${{ runner.os }}-playwright-

      - name: Install Playwright chromium + OS deps (cache miss)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps chromium

      # On cache hit the browser binaries are already on disk; we only need
      # the system libraries (libnss3, libatk, fonts, etc.) which are not
      # part of ~/.cache/ms-playwright.
      - name: Install Playwright OS deps only (cache hit)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: bunx playwright install-deps chromium

      - name: Run Playwright tests
        run: bunx playwright test --reporter=list,html
        env:
          # Force a stable CI baseline so screenshot diffs aren't tainted by
          # the local dev fonts the contributor happened to have installed.
          CI: "1"

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        id: upload-report
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload screenshot diffs (failures only)
        if: failure()
        uses: actions/upload-artifact@v4
        id: upload-diffs
        with:
          name: playwright-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14

      # On failure, surface the uploaded artifacts directly in the run
      # summary: a clickable link to download the HTML report + diff bundle,
      # plus an enumerated table of every failing test's actual / expected /
      # diff PNG path inside the test-results artifact. Reviewers no longer
      # need to scroll to the artifact panel or guess paths.
      - name: Summary (failure)
        if: failure()
        env:
          REPORT_URL: ${{ steps.upload-report.outputs.artifact-url }}
          DIFFS_URL: ${{ steps.upload-diffs.outputs.artifact-url }}
        run: |
          {
            echo "## Visual regression — ❌ failure"
            echo ""
            echo "### Artifacts"
            echo ""
            if [ -n "$REPORT_URL" ]; then
              echo "- 📊 [**playwright-report**]($REPORT_URL) — open \`index.html\` for the interactive actual vs expected vs diff viewer."
            else
              echo "- 📊 **playwright-report** — see the artifacts panel above."
            fi
            if [ -n "$DIFFS_URL" ]; then
              echo "- 🖼️ [**playwright-test-results**]($DIFFS_URL) — raw \`*-actual.png\`, \`*-expected.png\`, \`*-diff.png\` files per failing test."
            else
              echo "- 🖼️ **playwright-test-results** — see the artifacts panel above."
            fi
            echo ""
            echo "### Failing screenshots"
            echo ""
            if [ -d test-results ]; then
              # Enumerate every diff PNG so reviewers can see exactly which
              # tests regressed without opening the HTML report.
              diffs=$(find test-results -type f -name '*-diff.png' | sort)
              if [ -n "$diffs" ]; then
                echo "| Test | Actual | Expected | Diff |"
                echo "| --- | --- | --- | --- |"
                while IFS= read -r diff; do
                  dir=$(dirname "$diff")
                  base=$(basename "$diff" -diff.png)
                  test_name=$(basename "$dir")
                  actual="$dir/${base}-actual.png"
                  expected="$dir/${base}-expected.png"
                  echo "| \`$test_name\` / \`$base\` | \`${actual#test-results/}\` | \`${expected#test-results/}\` | \`${diff#test-results/}\` |"
                done <<< "$diffs"
              else
                echo "_No \`*-diff.png\` files were produced — failures may be non-visual (timeout, navigation, etc.). Check the HTML report._"
              fi
            else
              echo "_No \`test-results/\` directory was produced._"
            fi
            echo ""
            echo "### Accept intentional changes"
            echo ""
            echo '```bash'
            echo "# Reproduce locally first, confirm the diff is intended, then:"
            echo "bunx playwright test --update-snapshots"
            echo '```'
            echo ""
            echo "See \`e2e/README.md\` for the full safe-regeneration checklist."
          } >> "$GITHUB_STEP_SUMMARY"