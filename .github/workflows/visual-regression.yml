name: Visual regression

# Runs the Playwright screenshot suite (e2e/visual-regression.spec.ts plus the
# byline / card-height stability specs) on every PR and push to main. On
# failure, the playwright-report (with diff PNGs) and test-results folder are
# uploaded as artifacts so reviewers can inspect actual vs expected without
# re-running anything locally.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  playwright:
    name: Playwright — visual regression
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Cache the Playwright browser binaries (~150 MB) keyed on the
      # @playwright/test version pinned in the lockfile.
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright chromium + OS deps
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps chromium

      - name: Install Playwright OS deps (cache hit)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: bunx playwright install-deps chromium

      - name: Run Playwright tests
        run: bunx playwright test --reporter=list,html
        env:
          # Force a stable CI baseline so screenshot diffs aren't tainted by
          # the local dev fonts the contributor happened to have installed.
          CI: "1"

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload screenshot diffs (failures only)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Summary
        if: failure()
        run: |
          {
            echo "## Visual regression — ❌ failure"
            echo ""
            echo "Download the **playwright-report** artifact above and open"
            echo "\`index.html\` to view the actual vs expected vs diff PNG for"
            echo "each failing test. The raw diff images live in the"
            echo "**playwright-test-results** artifact."
            echo ""
            echo "To accept an intentional visual change locally:"
            echo ""
            echo '```bash'
            echo "bunx playwright test --update-snapshots"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"