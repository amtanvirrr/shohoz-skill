name: Visual regression

# Runs the Playwright screenshot suite (e2e/visual-regression.spec.ts plus the
# byline / card-height stability specs) on every PR and push to main. On
# failure, the playwright-report (with diff PNGs) and test-results folder are
# uploaded as artifacts so reviewers can inspect actual vs expected without
# re-running anything locally.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  playwright:
    name: Playwright — visual regression
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # `contents: write` lets us push diff PNGs to the `ci-visual-diffs`
    # orphan branch so the PR comment can embed them via raw.githubusercontent
    # URLs. `pull-requests: write` lets the sticky comment step create/update
    # the comment on the PR. Forked PRs fall back to artifact links only (the
    # token is read-only there — the publish step skips itself in that case).
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Use the split restore + save pattern so the cache is *saved even if
      # Playwright (or any later step) fails*. The combined `actions/cache@v4`
      # only writes on a fully successful job, which means a single flaky
      # visual-diff failure would force every subsequent PR to re-download
      # all Bun deps from scratch. Splitting the action keeps the populated
      # cache available for the next run regardless of test outcome, while
      # still respecting the frozen lockfile for reproducible installs.
      - name: Restore Bun cache
        id: bun-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Save the cache immediately after a successful install, even if later
      # steps fail. `if: always()` runs on failure too; the inner guard skips
      # the save on an exact-key cache hit (nothing new to persist).
      - name: Save Bun cache
        if: always() && steps.bun-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lockb') }}

      # This project is Vite + React (no Next.js / no .next directory). The
      # equivalent of Next's build cache is Vite's dep-optimizer cache at
      # `node_modules/.vite`, which stores prebundled deps so the dev server
      # the Playwright webServer boots doesn't have to re-optimize the
      # whole dep graph on every CI run. Cache hit shaves ~15-30s off
      # `bun run dev` startup.
      #
      # Key includes the lockfile hash so the cache is invalidated whenever
      # dependencies change (matching the frozen-lockfile install above),
      # plus the vite config hash so config edits also bust it.
      - name: Cache Vite dep-optimizer
        uses: actions/cache@v4
        with:
          path: |
            node_modules/.vite
            node_modules/.cache
          key: ${{ runner.os }}-vite-${{ hashFiles('**/bun.lockb', 'vite.config.*') }}
          restore-keys: |
            ${{ runner.os }}-vite-

      # Resolve the installed @playwright/test version so the browser cache
      # key is tied to *the binaries Playwright actually wants*, not to
      # bun.lockb (which churns on every unrelated dep bump and would
      # needlessly invalidate the 150 MB browser download).
      - name: Resolve Playwright version
        id: pw-version
        run: |
          version=$(node -p "require('@playwright/test/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Playwright version: $version"

      # Cache the Playwright browser binaries (~150 MB). We cache the global
      # ms-playwright directory keyed on OS + Playwright version + which
      # browser channels we install. A cache hit skips the full browser
      # download and only re-runs the apt-get system-deps step (fast).
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.pw-version.outputs.version }}-chromium
          restore-keys: |
            ${{ runner.os }}-playwright-${{ steps.pw-version.outputs.version }}-
            ${{ runner.os }}-playwright-

      - name: Install Playwright chromium + OS deps (cache miss)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps chromium

      # On cache hit the browser binaries are already on disk; we only need
      # the system libraries (libnss3, libatk, fonts, etc.) which are not
      # part of ~/.cache/ms-playwright.
      - name: Install Playwright OS deps only (cache hit)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: bunx playwright install-deps chromium

      - name: Run Playwright tests
        run: bunx playwright test --reporter=list,html
        env:
          # Force a stable CI baseline so screenshot diffs aren't tainted by
          # the local dev fonts the contributor happened to have installed.
          CI: "1"

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        id: upload-report
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload screenshot diffs (failures only)
        if: failure()
        uses: actions/upload-artifact@v4
        id: upload-diffs
        with:
          name: playwright-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14

      # On failure, surface the uploaded artifacts directly in the run
      # summary: a clickable link to download the HTML report + diff bundle,
      # plus an enumerated table of every failing test's actual / expected /
      # diff PNG path inside the test-results artifact. Reviewers no longer
      # need to scroll to the artifact panel or guess paths.
      - name: Summary (failure)
        if: failure()
        env:
          REPORT_URL: ${{ steps.upload-report.outputs.artifact-url }}
          DIFFS_URL: ${{ steps.upload-diffs.outputs.artifact-url }}
        run: |
          {
            echo "## Visual regression — ❌ failure"
            echo ""
            echo "### Artifacts"
            echo ""
            if [ -n "$REPORT_URL" ]; then
              echo "- 📊 [**playwright-report**]($REPORT_URL) — open \`index.html\` for the interactive actual vs expected vs diff viewer."
            else
              echo "- 📊 **playwright-report** — see the artifacts panel above."
            fi
            if [ -n "$DIFFS_URL" ]; then
              echo "- 🖼️ [**playwright-test-results**]($DIFFS_URL) — raw \`*-actual.png\`, \`*-expected.png\`, \`*-diff.png\` files per failing test."
            else
              echo "- 🖼️ **playwright-test-results** — see the artifacts panel above."
            fi
            echo ""
            echo "### Failing screenshots"
            echo ""
            if [ -d test-results ]; then
              # Enumerate every diff PNG so reviewers can see exactly which
              # tests regressed without opening the HTML report.
              diffs=$(find test-results -type f -name '*-diff.png' | sort)
              if [ -n "$diffs" ]; then
                echo "| Test | Actual | Expected | Diff |"
                echo "| --- | --- | --- | --- |"
                while IFS= read -r diff; do
                  dir=$(dirname "$diff")
                  base=$(basename "$diff" -diff.png)
                  test_name=$(basename "$dir")
                  actual="$dir/${base}-actual.png"
                  expected="$dir/${base}-expected.png"
                  echo "| \`$test_name\` / \`$base\` | \`${actual#test-results/}\` | \`${expected#test-results/}\` | \`${diff#test-results/}\` |"
                done <<< "$diffs"
              else
                echo "_No \`*-diff.png\` files were produced — failures may be non-visual (timeout, navigation, etc.). Check the HTML report._"
              fi
            else
              echo "_No \`test-results/\` directory was produced._"
            fi
            echo ""
            echo "### Accept intentional changes"
            echo ""
            echo '```bash'
            echo "# Reproduce locally first, confirm the diff is intended, then:"
            echo "bunx playwright test --update-snapshots"
            echo '```'
            echo ""
            echo "See \`e2e/README.md\` for the full safe-regeneration checklist."
          } >> "$GITHUB_STEP_SUMMARY"

      # ────────────────────────────────────────────────────────────────────────
      # Inline diff thumbnails in the PR comment
      # ────────────────────────────────────────────────────────────────────────
      # GitHub PR comments can't render images from private artifact ZIPs, so
      # on failure we push every `*-diff.png` (plus its matching actual /
      # expected) to an orphan `ci-visual-diffs` branch under
      # `pr-<number>/<sha>/…` and then post a sticky PR comment that embeds
      # the diff thumbnail via the raw.githubusercontent.com URL, wrapped in
      # a link to the full-size diff. Reviewers see regressions at a glance
      # without downloading any artifact.
      #
      # The branch is force-pushed per PR head SHA, so it never grows
      # unboundedly for an active PR; merged/closed PR paths can be GC'd by
      # a separate cleanup job.
      - name: Publish diff thumbnails to ci-visual-diffs branch
        id: publish-diffs
        if: failure() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ ! -d test-results ]; then
            echo "no test-results/ — skipping publish"
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          shopt -s nullglob globstar
          diffs=( test-results/**/*-diff.png )
          if [ ${#diffs[@]} -eq 0 ]; then
            echo "no diff PNGs to publish"
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BRANCH=ci-visual-diffs
          DEST_REL="pr-${PR_NUMBER}/${HEAD_SHA}"
          WORK=$(mktemp -d)

          git config --global user.name  "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Clone the branch if it exists; otherwise start an empty orphan.
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            git clone --depth 1 --branch "$BRANCH" \
              "https://x-access-token:${GITHUB_TOKEN:-${{ github.token }}}@github.com/${{ github.repository }}.git" "$WORK"
          else
            git clone --depth 1 \
              "https://x-access-token:${GITHUB_TOKEN:-${{ github.token }}}@github.com/${{ github.repository }}.git" "$WORK"
            ( cd "$WORK" && git checkout --orphan "$BRANCH" && git rm -rf . >/dev/null 2>&1 || true )
          fi

          # Replace this PR-sha's directory so we don't accumulate stale runs.
          # `${var:?}` aborts if either var is empty so rm can never expand to /.
          rm -rf "${WORK:?}/${DEST_REL:?}"
          mkdir -p "$WORK/$DEST_REL"

          # Copy every *-diff.png plus the sibling -actual / -expected.
          for diff in "${diffs[@]}"; do
            dir=$(dirname "$diff")
            base=$(basename "$diff" -diff.png)
            slug=$(basename "$dir" | tr -c '[:alnum:]._-' '_')
            out="$WORK/$DEST_REL/$slug"
            mkdir -p "$out"
            cp "$diff" "$out/${base}-diff.png"
            [ -f "$dir/${base}-actual.png"   ] && cp "$dir/${base}-actual.png"   "$out/"
            [ -f "$dir/${base}-expected.png" ] && cp "$dir/${base}-expected.png" "$out/"
          done

          # README at the orphan-branch root so accidental browsers know what
          # this branch is for.
          cat > "$WORK/README.md" <<'MD'
          # ci-visual-diffs

          Auto-generated by `.github/workflows/visual-regression.yml`. Each
          `pr-<n>/<sha>/<test>/` directory holds the `actual`, `expected`,
          and `diff` PNGs for a failing Playwright visual test, embedded in
          the matching PR comment via raw.githubusercontent.com URLs.

          Do not edit by hand — the workflow force-pushes per PR SHA.
          MD

          (
            cd "$WORK"
            git add -A
            if git diff --cached --quiet; then
              echo "nothing changed — skipping push"
              echo "published=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git commit -m "ci(visual-diffs): PR #${PR_NUMBER} @ ${HEAD_SHA}"
            git push origin "HEAD:${BRANCH}"
          )

          echo "published=true"   >> "$GITHUB_OUTPUT"
          echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"
          echo "dest=${DEST_REL}" >> "$GITHUB_OUTPUT"

      - name: Post diff thumbnails as PR comment
        if: failure() && steps.publish-diffs.outputs.published == 'true'
        uses: actions/github-script@v7
        env:
          REPORT_URL: ${{ steps.upload-report.outputs.artifact-url }}
          BRANCH: ${{ steps.publish-diffs.outputs.branch }}
          DEST: ${{ steps.publish-diffs.outputs.dest }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const { BRANCH, DEST, REPORT_URL } = process.env;
            const { owner, repo } = context.repo;
            const prNumber = context.payload.pull_request.number;
            const headSha  = context.payload.pull_request.head.sha;

            // raw.githubusercontent.com renders PNGs inline in PR comments.
            const rawBase = `https://raw.githubusercontent.com/${owner}/${repo}/${BRANCH}/${DEST}`;
            // blob/ URL gives reviewers a clickable full-size view with
            // GitHub's pan/zoom chrome.
            const blobBase = `https://github.com/${owner}/${repo}/blob/${BRANCH}/${DEST}`;

            // Walk the freshly-uploaded directory tree on disk (we still
            // have test-results/ from the same job) so the comment lists
            // every diff in the same order as the step summary table.
            const diffs = [];
            const walk = (dir) => {
              for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
                const p = path.join(dir, entry.name);
                if (entry.isDirectory()) walk(p);
                else if (entry.name.endsWith('-diff.png')) diffs.push(p);
              }
            };
            if (fs.existsSync('test-results')) walk('test-results');
            diffs.sort();

            const rows = diffs.map((diff) => {
              const dir   = path.dirname(diff);
              const base  = path.basename(diff, '-diff.png');
              const slug  = path.basename(dir).replace(/[^A-Za-z0-9._-]/g, '_');
              const diffUrl     = `${rawBase}/${slug}/${base}-diff.png`;
              const actualUrl   = `${rawBase}/${slug}/${base}-actual.png`;
              const expectedUrl = `${rawBase}/${slug}/${base}-expected.png`;
              const fullDiff    = `${blobBase}/${slug}/${base}-diff.png`;
              const fullActual  = `${blobBase}/${slug}/${base}-actual.png`;
              const fullExpect  = `${blobBase}/${slug}/${base}-expected.png`;
              const thumb = (src, href, alt) =>
                `<a href="${href}"><img src="${src}" width="240" alt="${alt}" /></a>`;
              return `| \`${slug}\` / \`${base}\` | ${thumb(actualUrl, fullActual, `${base} actual`)} | ${thumb(expectedUrl, fullExpect, `${base} expected`)} | ${thumb(diffUrl, fullDiff, `${base} diff`)} |`;
            });

            const marker = '<!-- visual-regression-diff-comment -->';
            const reportLine = REPORT_URL
              ? `📊 [Full Playwright HTML report](${REPORT_URL}) · `
              : '';
            const body = [
              marker,
              `## Visual regression — ❌ ${diffs.length} failing screenshot(s)`,
              '',
              `${reportLine}Commit \`${headSha.slice(0, 7)}\` · click any thumbnail for the full-size image.`,
              '',
              '| Test | Actual | Expected | Diff |',
              '| --- | --- | --- | --- |',
              ...rows,
              '',
              '<sub>Accept intentional changes with `bunx playwright test --update-snapshots` — see `e2e/README.md`.</sub>',
            ].join('\n');

            // Sticky comment: find an existing one by marker and edit it
            // rather than spamming a new comment on every push to the PR.
            const { data: comments } = await github.rest.issues.listComments({
              owner, repo, issue_number: prNumber, per_page: 100,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existing.id, body,
              });
              core.info(`updated PR comment #${existing.id}`);
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number: prNumber, body,
              });
              core.info('created new PR comment');
            }